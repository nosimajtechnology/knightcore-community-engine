name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate acceptance matrix
        run: python3 scripts/validate_acceptance.py
      - name: Build and verify release assets
        run: |
          python3 scripts/build_release.py
          cd dist
          sha256sum -c SHA256SUMS
      - name: Create or update tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/knightcore-community-engine.zip dist/SHA256SUMS \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/knightcore-community-engine.zip dist/SHA256SUMS \
              --title "Knightcore Community Engine ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

